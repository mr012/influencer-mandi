<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Influencer Mandi — Compare intros</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#090909;color:#f5f3ef;font:14px Arial,sans-serif}
    body{display:flex;flex-direction:column}
    header{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#151515;border-bottom:1px solid #333}
    .title{margin-right:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#aaa}
    label{font-size:12px;color:#aaa}
    select,button{min-height:42px;border:1px solid #444;border-radius:9px;padding:8px 12px;background:#202020;color:#fff;font:inherit;cursor:pointer}
    button.primary{background:#ff3d00;border-color:#ff3d00;color:#090909;font-weight:bold}
    button:focus-visible,select:focus-visible{outline:2px solid #c6ff00;outline-offset:3px}
    #status{font-size:11px;color:#aaa;min-width:110px}
    iframe{display:block;flex:1;min-height:0;width:100%;border:0;background:#090909}
    @media(max-width:600px){header{gap:8px;padding:10px}.title{flex-basis:100%}label{display:none}select{flex:1;min-width:0}#status{display:none}button{font-size:12px;padding:8px 10px}}
  </style>
</head>
<body>
  <header>
    <span class="title">Influencer Mandi · Intro comparison</span>
    <label for="intro">Choose intro</label>
    <select id="intro">
      <option value="1">Intro 1 · Original · 7.4s</option>
      <option value="2">Intro 2 · Slower beats · 8s</option>
    </select>
    <button type="button" class="primary" id="play">Play / Replay</button>
    <button type="button" id="landing">View landing</button>
    <span id="status" role="status">Intro 1 selected</span>
  </header>
  <iframe id="preview" title="Selected Influencer Mandi intro preview" src="intro-1.html?intro=0"></iframe>
  <script>
    const selector=document.querySelector('#intro');
    const preview=document.querySelector('#preview');
    const status=document.querySelector('#status');
    function show(play){
      preview.src='intro-'+selector.value+'.html?intro='+(play?'1':'0')+'&preview='+Date.now();
      status.textContent='Intro '+selector.value+(play?' · playing':' · landing');
    }
    selector.addEventListener('change',()=>show(true));
    document.querySelector('#play').addEventListener('click',()=>show(true));
    document.querySelector('#landing').addEventListener('click',()=>show(false));
  </script>
</body>
</html>
